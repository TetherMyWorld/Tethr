<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tethr</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0b1020;
      color: #fff;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 24px;
    }

    .card {
      background: #151c2f;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #24304d;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .hero img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .box {
      background: #1b243c;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #2b3a5f;
    }

    .label {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .value {
      font-size: 16px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: #2b3a5f;
      border: none;
      color: white;
      padding: 6px 12px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background: #3c4f7f;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .open-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .open-btn:hover {
      background: #2563eb;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1 id="title">Loading...</h1>

      <div id="content">Loading item...</div>
    </div>
  </div>

  <script>
    const API_URL = "https://kyihwtasfjkwcevtdtbp.supabase.co/functions/v1/gpt-bridge";

    function getItemId() {
      return new URLSearchParams(window.location.search).get("id");
    }

    function setTitle(name) {
      document.title = `${name} — Tethr`;
    }

    async function updateQuantity(itemId, newQuantity) {
      await fetch(API_URL, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          item_id: itemId,
          quantity: newQuantity
        })
      });
    }

    async function loadItem() {
      const id = getItemId();
      if (!id) return;

      const res = await fetch(API_URL);
      const data = await res.json();

      const item = data.data.find(i => i.id === id);
      if (!item) return;

      setTitle(item.name);
      document.getElementById("title").innerText = item.name;

      const photo = item.photos?.[0]?.signed_url || "";

      document.getElementById("content").innerHTML = `
        <div class="hero">
          ${photo ? `<img src="${photo}" />` : ""}
        </div>

        <div class="meta">
          <div class="box">
            <div class="label">Notes</div>
            <div class="value">${item.notes || "—"}</div>
          </div>

          <div class="box">
            <div class="label">Container</div>
            <div class="value">${item.containers?.name || "—"}</div>
          </div>

          <div class="box">
            <div class="label">Quantity</div>
            <div class="quantity-controls">
              <button class="btn" id="minus">−</button>
              <span id="qty">${item.quantity || 1}</span>
              <button class="btn" id="plus">+</button>
            </div>
          </div>
        </div>

        <button class="open-btn" onclick="openMain('${item.id}')">
          Open in Tethr
        </button>
      `;

      const qtyEl = document.getElementById("qty");
      const minusBtn = document.getElementById("minus");
      const plusBtn = document.getElementById("plus");

      let qty = item.quantity || 1;

      function refresh() {
        qtyEl.innerText = qty;
        minusBtn.disabled = qty <= 1;
      }

      minusBtn.onclick = async () => {
        if (qty <= 1) return;
        qty--;
        refresh();
        await updateQuantity(item.id, qty);
      };

      plusBtn.onclick = async () => {
        qty++;
        refresh();
        await updateQuantity(item.id, qty);
      };

      refresh();
    }

    function openMain(id) {
      window.open(`https://tethr-blue.vercel.app/?item_id=${id}`, "_blank");
    }

    loadItem();
  </script>
</body>
</html>
