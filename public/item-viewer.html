<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tethr Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0b1020;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 12px;
    }

    .image {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .card {
      background: #151c2f;
      padding: 12px;
      border-radius: 10px;
    }

    .label {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .value {
      font-size: 16px;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: #2b3a5f;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    .btn:hover {
      background: #3c4f7f;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .open {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .open:hover {
      background: #2563eb;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 id="title">Loading...</h1>
    <div id="content">Loading...</div>
  </div>

  <script>
    const API = "https://kyihwtasfjkwcevtdtbp.supabase.co/functions/v1/gpt-bridge";

    function getId() {
      return new URLSearchParams(window.location.search).get("id");
    }

    async function updateQty(id, qty) {
      await fetch(API, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          item_id: id,
          quantity: qty
        })
      });
    }

    async function load() {
      const id = getId();
      if (!id) return;

      const res = await fetch(API);
      const json = await res.json();

      const item = json.data.find(x => x.id === id);
      if (!item) return;

      window.currentItem = item;

      document.title = item.name + " — Tethr";
      document.getElementById("title").innerText = item.name;

      const img = item.photos?.[0]?.signed_url || "";

      document.getElementById("content").innerHTML = `
        ${img ? `<img class="image" src="${img}">` : ""}

        <div class="grid">
          <div class="card">
            <div class="label">Notes</div>
            <div class="value">${item.notes || "—"}</div>
          </div>

          <div class="card">
            <div class="label">Container</div>
            <div class="value">${item.containers?.name || "—"}</div>
          </div>

          <div class="card">
            <div class="label">Quantity</div>
            <div class="qty">
              <button class="btn" id="minus">−</button>
              <span id="q">${item.quantity || 1}</span>
              <button class="btn" id="plus">+</button>
            </div>
          </div>
        </div>

        <button class="open" onclick="openItem('${item.id}')">
          Open in Tethr
        </button>
      `;

      let qty = item.quantity || 1;
      const q = document.getElementById("q");
      const minus = document.getElementById("minus");
      const plus = document.getElementById("plus");

      function refresh() {
        q.innerText = qty;
        minus.disabled = qty <= 1;
      }

      minus.onclick = async () => {
        if (qty <= 1) return;
        qty--;
        refresh();
        await updateQty(item.id, qty);
      };

      plus.onclick = async () => {
        qty++;
        refresh();
        await updateQty(item.id, qty);
      };

      refresh();
    }

    function slugify(value) {
  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/['"]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "") || "container";
}

function slugify(value) {
      return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/['"]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "") || "container";
    }

    function openItem() {
      const item = window.currentItem || null;
      const container = item?.containers || null;
      const containerId = container?.id || "";

      if (!item) {
        alert("This item is not loaded yet.");
        return;
      }

      if (!containerId) {
        alert("This item does not have a container link yet.");
        return;
      }

      const containerSlug = container?.slug || slugify(container?.name || "");

      window.location.href =
        "https://tethr-blue.vercel.app/containers/" +
        containerSlug +
        "-" +
        containerId +
        "?item=" +
        encodeURIComponent(item.id);
    }

    load();
  </script>
</body>
</html>
