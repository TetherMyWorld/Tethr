<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tethr Item Viewer</title>

  <style>
    :root {
      --bg: #0b1020;
      --panel: #151c2f;
      --panel-border: #24304d;
      --text: #f4f7fb;
      --muted: #aeb7c8;
      --accent: #7dd3fc;
      --danger: #ff8c8c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #10182d 0%, #070b16 55%, #04070f 100%);
      color: var(--text);
    }

    .page {
      max-width: 980px;
      margin: 28px auto;
      padding: 0 18px 40px;
    }

    .card {
      background: rgba(21, 28, 47, 0.92);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 800;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
      padding-top: 8px;
    }

    .hero {
      margin-top: 18px;
      margin-bottom: 20px;
    }

    .hero img {
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      display: block;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      background: #0b0f19;
    }

    .hero-caption {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 6px;
    }

    .meta-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 14px;
    }

    .meta-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .meta-value {
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
    }

    .section {
      margin-top: 24px;
    }

    .section h2 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 800;
    }

    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .photo-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      overflow: hidden;
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #0b0f19;
    }

    .photo-body {
      padding: 12px 14px 14px;
    }

    .photo-file {
      font-weight: 700;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .photo-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    .error {
      color: var(--danger);
      border: 1px solid rgba(255, 140, 140, 0.35);
      border-radius: 14px;
      padding: 16px;
      background: rgba(255, 100, 100, 0.04);
      line-height: 1.5;
    }

    .empty {
      color: var(--muted);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.02);
      line-height: 1.5;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      word-break: break-all;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .page {
        margin-top: 18px;
        padding: 0 12px 28px;
      }

      .card {
        padding: 16px;
      }

      h1 {
        font-size: 24px;
      }

      .header-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="eyebrow">Tethr</div>
      <div class="header-row">
        <h1 id="title">Loading…</h1>
        <div id="status" class="status">Loading</div>
      </div>
      <div id="content">Loading item…</div>
    </div>
  </div>

  <script>
    const API_URL = "https://kyihwtasfjkwcevtdtbp.supabase.co/functions/v1/gpt-bridge";

    function getItemId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setDynamicTitle(name) {
      if (name) {
        document.title = `${name} — Tethr`;
      }
    }

    function renderError(message) {
      document.getElementById("status").textContent = "Error";
      document.getElementById("content").innerHTML = `
        <div class="error">
          <strong>${escapeHtml(message)}</strong>
        </div>
      `;
    }

    function formatDate(value) {
      if (!value) return "—";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return d.toLocaleString();
    }

    function formatBytes(bytes) {
      const n = Number(bytes);
      if (!Number.isFinite(n)) return "—";
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / (1024 * 1024)).toFixed(1)} MB`;
    }

    async function loadItem() {
      const itemId = getItemId();

      if (!itemId) {
        renderError("No item ID provided in the URL.");
        return;
      }

      try {
        const res = await fetch(API_URL, {
          method: "GET",
          headers: {
            "Content-Type": "application/json"
          }
        });

        const data = await res.json();

        if (!res.ok) {
          renderError(`API error: ${JSON.stringify(data)}`);
          return;
        }

        const item = (data.data || []).find(i => i.id === itemId);

        if (!item) {
          document.getElementById("status").textContent = "Not found";
          document.getElementById("content").innerHTML = `
            <div class="empty">No item found for this ID.</div>
          `;
          return;
        }

        setDynamicTitle(item.name);
        document.getElementById("title").textContent = item.name || "Unnamed item";
        document.getElementById("status").textContent = "Loaded";

        const photos = Array.isArray(item.photos) ? item.photos : [];
        const heroPhoto = photos.find(p => p.signed_url) || null;
        const otherPhotos = heroPhoto
          ? photos.filter(p => p.id !== heroPhoto.id)
          : photos;

        const containerName = item.containers?.name || "Unknown";

        let html = "";

        if (heroPhoto && heroPhoto.signed_url) {
          html += `
            <div class="hero">
              <img src="${escapeHtml(heroPhoto.signed_url)}" alt="${escapeHtml(heroPhoto.file_name || item.name || "Item image")}" />
              <div class="hero-caption">${escapeHtml(heroPhoto.file_name || "")}</div>
            </div>
          `;
        }

        html += `
          <div class="meta-grid">
            <div class="meta-box">
              <div class="meta-label">Notes</div>
              <div class="meta-value">${escapeHtml(item.notes || "—")}</div>
            </div>

            <div class="meta-box">
              <div class="meta-label">Description</div>
              <div class="meta-value">${escapeHtml(item.description || "—")}</div>
            </div>

            <div class="meta-box">
              <div class="meta-label">Container</div>
              <div class="meta-value">${escapeHtml(containerName)}</div>
            </div>

            <div class="meta-box">
              <div class="meta-label">Quantity</div>
              <div class="meta-value">${escapeHtml(item.quantity ?? "—")}</div>
            </div>

            <div class="meta-box">
              <div class="meta-label">Created</div>
              <div class="meta-value">${escapeHtml(formatDate(item.created_at))}</div>
            </div>

            <div class="meta-box">
              <div class="meta-label">Updated</div>
              <div class="meta-value">${escapeHtml(formatDate(item.updated_at))}</div>
            </div>

            <div class="meta-box">
              <div class="meta-label">Item ID</div>
              <div class="meta-value mono">${escapeHtml(item.id)}</div>
            </div>

            <div class="meta-box">
              <div class="meta-label">Container ID</div>
              <div class="meta-value mono">${escapeHtml(item.container_id || "—")}</div>
            </div>
          </div>
        `;

        if (otherPhotos.length > 0) {
          html += `
            <div class="section">
              <h2>More Photos</h2>
              <div class="photos-grid">
                ${otherPhotos.map(photo => `
                  <div class="photo-card">
                    ${
                      photo.signed_url
                        ? `<img src="${escapeHtml(photo.signed_url)}" alt="${escapeHtml(photo.file_name || "Photo")}" />`
                        : ""
                    }
                    <div class="photo-body">
                      <div class="photo-file">${escapeHtml(photo.file_name || "Unnamed photo")}</div>
                      <div class="photo-meta">
                        <div>Caption: ${escapeHtml(photo.caption || "—")}</div>
                        <div>Type: ${escapeHtml(photo.mime_type || "—")}</div>
                        <div>Size: ${escapeHtml(formatBytes(photo.size_bytes))}</div>
                        <div>Added: ${escapeHtml(formatDate(photo.created_at))}</div>
                        ${
                          photo.signed_url
                            ? `<div style="margin-top:8px;"><a href="${escapeHtml(photo.signed_url)}" target="_blank" rel="noopener noreferrer">Open full image</a></div>`
                            : ""
                        }
                      </div>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
          `;
        }

        if (photos.length === 0) {
          html += `
            <div class="section">
              <div class="empty">No photos available for this item.</div>
            </div>
          `;
        }

        document.getElementById("content").innerHTML = html;
      } catch (e) {
        renderError(`Failed to load item: ${e}`);
      }
    }

    loadItem();
  </script>
</body>
</html>
