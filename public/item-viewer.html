<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tethr Item Viewer</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f1115;
      color: #fff;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 24px;
    }

    .card {
      background: #1a1f29;
      border-radius: 12px;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
    }

    .meta {
      margin-bottom: 20px;
      color: #aaa;
    }

    img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 12px;
    }

    .photo {
      margin-top: 20px;
    }

    .error {
      color: #ff8080;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1 id="title">Loading...</h1>
      <div id="content">Loading item...</div>
    </div>
  </div>

  <script>
    const API_URL = "https://kyihwtasfjkwcevtdtbp.supabase.co/functions/v1/gpt-bridge";

    function getItemId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    function setDynamicTitle(name) {
      if (!name) return;
      document.title = `${name} — Tethr`;
    }

    async function loadItem() {
      const itemId = getItemId();

      if (!itemId) {
        document.getElementById("content").innerHTML =
          '<div class="error">No item ID provided</div>';
        return;
      }

      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        const item = data.data.find(i => i.id === itemId);

        if (!item) {
          document.getElementById("content").innerHTML =
            '<div class="error">Item not found</div>';
          return;
        }

        // Set tab title
        setDynamicTitle(item.name);

        // Set header title
        document.getElementById("title").innerText = item.name;

        let html = `
          <div class="meta">
            <div><strong>Notes:</strong> ${item.notes || "—"}</div>
            <div><strong>Description:</strong> ${item.description || "—"}</div>
            <div><strong>Item ID:</strong> ${item.id}</div>
            <div><strong>Container ID:</strong> ${item.container_id}</div>
          </div>
        `;

        if (item.photos && item.photos.length > 0) {
          html += `<div><strong>Photos:</strong></div>`;

          html += item.photos.map(p => `
            <div class="photo">
              <img src="${p.signed_url}" />
              <div style="color:#aaa; font-size:12px;">
                ${p.file_name || ""}
              </div>
            </div>
          `).join("");
        } else {
          html += `<div>No photos available</div>`;
        }

        document.getElementById("content").innerHTML = html;

      } catch (e) {
        document.getElementById("content").innerHTML =
          `<div class="error">Failed to load item: ${e}</div>`;
      }
    }

    loadItem();
  </script>
</body>
</html>
